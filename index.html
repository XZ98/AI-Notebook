<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <title>Meeting Notebook</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f2; --surface: #fff; --ink: #20231f; --muted: #767a73; --line: #e8e7e2;
      --accent: #d9775f; --accent-soft: #fbede8; --green: #4a7561; --shadow: 0 12px 35px #39392b0d;
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 252px 320px minmax(0, 1fr); min-height: 100vh; }
    .rail { display: flex; flex-direction: column; min-height: 100vh; padding: 22px 14px; background: #f0efeb; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 24px; font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #fff; background: var(--accent); font-size: 16px; }
    .new-btn, .primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 13px; border: 0; border-radius: 10px; color: #fff; background: var(--accent); font-weight: 650; }
    .new-btn { margin: 0 4px 20px; box-shadow: 0 4px 12px #d9775f22; }
    .new-btn:hover, .primary:hover { background: #c9654d; }
    .nav-group { display: grid; gap: 4px; }
    .nav-label { padding: 15px 10px 6px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; color: #50544e; background: transparent; text-align: left; }
    .nav-item:hover, .nav-item.active { color: var(--ink); background: #e7e5df; }
    .nav-item.active { font-weight: 700; }
    .nav-item .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .nav-icon { display: inline-grid; place-items: center; width: 18px; color: #878b83; font-size: 16px; }
    .notebooks { display: grid; gap: 3px; }
    .notebook-row { display: flex; align-items: center; gap: 5px; }
    .notebook-row .nav-item { min-width: 0; }
    .notebook-row .nav-item span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 9px; color: var(--muted); background: transparent; }
    .icon-btn:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
    .rail-bottom { margin-top: auto; padding: 16px 5px 0; border-top: 1px solid #e3e1dc; }
    .account { padding: 5px 9px 0; color: var(--muted); font-size: 12px; }
    .library { min-width: 0; height: 100vh; overflow: auto; background: #faf9f7; border-right: 1px solid var(--line); }
    .library-head { position: sticky; top: 0; z-index: 3; padding: 19px 16px 12px; background: #faf9f7ee; backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .library-title-row { display: flex; align-items: center; gap: 10px; }
    .library-title-row h1 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
    .library-title-row .icon-btn { margin-left: auto; }
    .search { position: relative; margin-top: 15px; }
    .search input { width: 100%; height: 39px; padding: 0 12px 0 36px; border: 1px solid #e7e5e0; border-radius: 10px; outline: 0; background: var(--surface); }
    .search input:focus { border-color: #d3a398; box-shadow: 0 0 0 3px #d9775f15; }
    .meeting-list { display: grid; gap: 3px; padding: 9px; }
    .meeting-card { display: block; width: 100%; padding: 12px; border: 1px solid transparent; border-radius: 11px; background: transparent; text-align: left; }
    .meeting-card:hover { background: #f1f0ec; }
    .meeting-card.selected { border-color: #eee2de; background: #fff; box-shadow: 0 2px 8px #39392b08; }
    .meeting-card-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 680; }
    .meeting-card-title span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meeting-card-date { flex: none; color: #999b95; font-size: 11px; font-weight: 450; }
    .meeting-card-summary { display: -webkit-box; margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 12px; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .meeting-card-meta { display: flex; gap: 6px; margin-top: 9px; color: #92958d; font-size: 10px; }
    .tag { padding: 2px 7px; border-radius: 999px; background: #f0efeb; }
    .empty-list { padding: 34px 18px; color: var(--muted); text-align: center; }
    .editor-shell { min-width: 0; height: 100vh; overflow: auto; }
    .editor-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 62px; padding: 11px clamp(18px, 4vw, 52px); background: #f6f5f2ee; backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .save-state { margin-right: auto; color: var(--muted); font-size: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: #50544e; font-weight: 580; }
    .btn:hover { border-color: #d8d6d0; color: var(--ink); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn.danger { color: #b94f45; }
    .btn.recording { color: #b94f45; border-color: #e6aaa0; background: #fff5f2; }
    .editor { width: min(850px, 100%); margin: 0 auto; padding: 36px clamp(20px, 5vw, 68px) 90px; }
    .crumb { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .crumb input { width: 180px; padding: 3px 7px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; }
    .crumb input:focus { border-color: var(--line); outline: 0; background: #fff; }
    .title-input { display: block; width: 100%; margin: 16px 0 18px; padding: 0; border: 0; outline: 0; background: transparent; font-size: clamp(29px, 4vw, 40px); font-weight: 720; letter-spacing: -.055em; line-height: 1.16; }
    .title-input::placeholder { color: #b5b6b0; }
    .meta-row { display: grid; grid-template-columns: 110px minmax(0,1fr); align-items: center; gap: 12px; margin: 8px 0; color: var(--muted); font-size: 12px; }
    .meta-row label { display: flex; align-items: center; gap: 7px; }
    .meta-row input { width: 100%; min-width: 0; padding: 6px 9px; border: 1px solid transparent; border-radius: 7px; outline: 0; background: transparent; }
    .meta-row input:hover, .meta-row input:focus { border-color: var(--line); background: #fff; }
    .divider { height: 1px; margin: 25px 0; background: var(--line); }
    .section { margin: 24px 0; }
    .section-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 13px; font-weight: 750; letter-spacing: .005em; }
    .section-icon { color: var(--accent); }
    .section textarea { display: block; width: 100%; min-height: 96px; padding: 12px 13px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; outline: 0; background: #fff; line-height: 1.65; }
    .section textarea:focus, .action-row input:focus { border-color: #d3a398; box-shadow: 0 0 0 3px #d9775f12; }
    .section textarea::placeholder { color: #b2b4ad; }
    .summary-area { min-height: 100px !important; font-size: 15px; }
    .quiet { color: var(--muted); font-size: 12px; }
    .transcript-area { min-height: 180px !important; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .action-list { display: grid; gap: 8px; }
    .action-row { display: grid; grid-template-columns: 24px minmax(140px,1fr) minmax(90px,130px) 150px 32px; align-items: center; gap: 7px; }
    .action-row input:not([type=checkbox]) { min-width: 0; width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: #fff; font-size: 12px; }
    .action-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--green); }
    .action-row.done input:not([type=checkbox]) { color: #999; text-decoration: line-through; }
    .action-add { margin-top: 9px; padding: 5px 0; border: 0; color: var(--green); background: transparent; font-size: 12px; font-weight: 650; }
    .transcript-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; }
    .privacy-callout { padding: 10px 12px; border: 1px solid #f1e1dc; border-radius: 9px; background: #fff8f5; color: #81584e; font-size: 11px; line-height: 1.5; }
    .toast { position: fixed; right: 22px; bottom: 20px; z-index: 10; max-width: min(420px, calc(100vw - 32px)); padding: 11px 15px; transform: translateY(12px); opacity: 0; pointer-events: none; border-radius: 10px; color: #fff; background: #242722; box-shadow: var(--shadow); transition: .18s ease; }
    .toast.show { transform: none; opacity: 1; }
    .modal-back { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 18px; background: #1b1c1880; }
    .modal { width: min(480px, 100%); max-height: 90vh; overflow: auto; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 24px 80px #0003; }
    .modal h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.03em; }
    .modal p { color: var(--muted); font-size: 13px; }
    .modal label { display: grid; gap: 5px; margin: 12px 0; color: #5b5e58; font-size: 12px; font-weight: 650; }
    .modal input, .modal select { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--surface); }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
    .modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
    .loading { padding: 40px; color: var(--muted); text-align: center; }
    .empty-editor { display: grid; min-height: calc(100vh - 62px); place-content: center; padding: 30px; color: var(--muted); text-align: center; }
    .empty-editor b { color: var(--ink); font-size: 22px; letter-spacing: -.04em; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    .search-mark { position: absolute; top: 50%; left: 12px; width: 16px; height: 16px; transform: translateY(-50%); color: #8d9089; pointer-events: none; }
    .btn.active-seg, .chip-btn.on { background: var(--accent-soft); border-color: #eec9be; color: #a2412a; font-weight: 650; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .chip-btn { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #50544e; font-size: 12px; }
    .chip-btn span { margin-left: 3px; color: var(--muted); }
    .group-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
    .people-add { display: grid; grid-template-columns: 1fr 1.3fr 1.2fr auto; gap: 8px; }
    .people-add input, .contact-row input, #bulkText { min-width: 0; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: #fff; font-size: 13px; }
    .people-add input:focus, .contact-row input:focus, .people-input-row input:focus { border-color: #d3a398; box-shadow: 0 0 0 3px #d9775f12; }
    #bulkText { display: block; min-height: 90px; margin-top: 10px; }
    .contact-row { display: grid; grid-template-columns: 1fr 1.3fr 1.2fr 32px; gap: 7px; margin: 6px 0; }
    .meta-row.people-row { align-items: start; }
    .people-picker { position: relative; min-width: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chips:not(:empty) { margin-bottom: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 4px 3px 10px; border-radius: 999px; background: #eceae4; color: var(--ink); font-size: 12px; }
    .chip button { display: grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); line-height: 1; }
    .chip button:hover { background: #d9d6cd; color: var(--ink); }
    .people-input-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .people-input-row input { flex: 1 1 170px; min-width: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; outline: 0; background: #fff; }
    .people-input-row select { padding: 6px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .people-menu { position: absolute; z-index: 5; top: 100%; left: 0; width: min(420px, 100%); max-height: 260px; margin-top: 4px; padding: 4px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: var(--shadow); }
    .people-menu[hidden], .chat-bar[hidden] { display: none; }
    .people-opt { display: flex; flex-direction: column; gap: 1px; width: 100%; padding: 7px 9px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
    button.people-opt:hover { background: #f3f1ec; }
    .people-opt span { color: var(--muted); font-size: 11px; }
    .act-group { margin: 24px 0; }
    .act-group h3 { margin: 0 0 8px; font-size: 14px; }
    .act-row { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: start; margin: 6px 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .act-row input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--green); }
    .act-row.done .act-task { color: #999; text-decoration: line-through; }
    .act-meta { color: var(--muted); font-size: 12px; }
    .act-meta.overdue { color: #b94f45; font-weight: 650; }
    .trash-card { cursor: default; }
    .trash-actions { display: flex; gap: 8px; margin-top: 10px; }
    .chat-fab { position: fixed; right: 22px; bottom: 22px; z-index: 7; width: 48px; height: 48px; border: 0; border-radius: 50%; color: #fff; background: var(--accent); box-shadow: var(--shadow); font-size: 20px; }
    .chat-bar { position: fixed; right: 22px; bottom: 80px; z-index: 7; display: flex; flex-direction: column; width: min(400px, calc(100vw - 32px)); max-height: min(560px, calc(100vh - 110px)); overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 24px 80px #0003; }
    .chat-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .chat-head select { margin-left: auto; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .chat-msgs { flex: 1; min-height: 120px; padding: 12px 14px; overflow: auto; }
    .chat-q { margin: 8px 0 4px; text-align: right; }
    .chat-q span { display: inline-block; max-width: 90%; padding: 7px 11px; border-radius: 12px 12px 3px 12px; background: var(--accent-soft); text-align: left; }
    .chat-a { margin: 4px 0 10px; padding: 8px 11px; border-radius: 12px 12px 12px 3px; background: #f3f1ec; line-height: 1.55; }
    .chat-a p { margin: 0 0 6px; }
    .chat-a.err { color: #b94f45; }
    .chat-form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
    .chat-form input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; outline: 0; }
    @media (max-width: 740px) { .people-add { grid-template-columns: 1fr; } .contact-row { grid-template-columns: 1fr 32px; } .contact-row input:nth-child(2), .contact-row input:nth-child(3) { grid-column: 1; } .chat-fab { bottom: calc(70px + env(safe-area-inset-bottom)); } .chat-bar { bottom: calc(128px + env(safe-area-inset-bottom)); } }
    @media (max-width: 960px) { .app { grid-template-columns: 205px minmax(250px, 300px) minmax(0,1fr); } .rail { padding-inline: 9px; } .editor { padding-inline: 28px; } }
    @media (max-width: 740px) {
      .app { display: block; }
      .rail { position: fixed; z-index: 6; right: 0; bottom: 0; left: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-around; min-height: auto; height: calc(58px + env(safe-area-inset-bottom)); padding: 4px 6px env(safe-area-inset-bottom); border-top: 1px solid var(--line); border-right: 0; background: #f8f7f4ed; backdrop-filter: blur(12px); }
      .brand, .new-btn, .nav-label, .notebooks, .rail-bottom { display: none; }
      .nav-group { display: contents; }
      .nav-item { display: grid; justify-items: center; gap: 0; width: auto; min-width: 62px; padding: 5px 8px; font-size: 10px; }
      .nav-item .count { display: none; }
      .nav-icon { font-size: 17px; }
      .library { position: fixed; inset: 0 0 calc(58px + env(safe-area-inset-bottom)); z-index: 1; height: auto; border-right: 0; }
      .editor-shell { display: none; height: calc(100dvh - 58px - env(safe-area-inset-bottom)); }
      .app.mobile-editor .library { display: none; }
      .app.mobile-editor .editor-shell { display: block; }
      .editor-top { min-height: 54px; padding-inline: 13px; }
      .editor { padding: 25px 18px 70px; }
      .title-input { font-size: 31px; }
      .action-row { grid-template-columns: 20px minmax(110px,1fr) minmax(80px,100px) 32px; }
      .action-row .due-input { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="Notebook navigation">
      <div class="brand"><span class="brand-mark">&#x2733;</span> Meeting Notebook</div>
      <button class="new-btn" id="newMeeting"><span>&#xff0b;</span> New meeting</button>
      <div class="nav-group">
        <button class="nav-item active" data-filter="all"><span class="nav-icon">&#x25a4;</span><span>All meetings</span><span class="count" id="allCount"></span></button>
        <button class="nav-item" data-filter="inbox"><span class="nav-icon">&#x2311;</span><span>Inbox</span><span class="count" id="inboxCount"></span></button>
        <button class="nav-item" data-filter="actions"><span class="nav-icon">&#x2611;</span><span>Action items</span></button>
        <button class="nav-item" data-filter="trash"><span class="nav-icon">&#x232b;</span><span>Recycle bin</span></button>
        <button class="nav-item" id="peopleButton"><span class="nav-icon">&#x2659;</span><span>People &amp; groups</span></button>
      </div>
      <div class="nav-label">Notebooks <button class="icon-btn" id="addNotebook" title="Create a notebook" aria-label="Create a notebook">&#xff0b;</button></div>
      <div class="notebooks" id="notebooks"></div>
      <div class="rail-bottom">
        <button class="nav-item" id="settingsButton"><span class="nav-icon">&#x2699;</span><span>AI &amp; settings</span></button>
        <div class="account" id="accountLabel">Starting...</div>
      </div>
    </aside>
    <section class="library" aria-label="Meeting directory">
      <header class="library-head">
        <div class="library-title-row"><h1 id="listTitle">All meetings</h1><button class="icon-btn" id="listNew" title="New meeting" aria-label="New meeting">&#xff0b;</button></div>
        <label class="search"><svg class="search-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="Search notes, decisions, people..." autocomplete="off" aria-label="Fuzzy search all meeting notes"></label>
      </header>
      <div class="meeting-list" id="meetingList" aria-live="polite" aria-busy="true"><div class="loading">Loading your notebooks&#x2026;</div></div>
    </section>
    <main class="editor-shell" id="editorShell"><div class="empty-editor"><div><b>Your meetings, thoughtfully organized.</b><p>Choose a meeting or start a new one.</p><button class="primary" id="emptyNew">&#xff0b; New meeting</button></div></div></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="audioFile" class="visually-hidden" type="file" accept="audio/*,.wav,.mp3,.m4a,.webm,.ogg,.flac">
  <script>
    window.addEventListener('error', (event) => {
      const list = document.getElementById('meetingList');
      if (!list) return;
      list.setAttribute('aria-busy', 'false');
      const escape = (value) => String(value || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const location = event.lineno ? `Line ${event.lineno}, column ${event.colno || 0}` : 'Source location unavailable';
      list.innerHTML = `<div class="empty-list">The notebook script failed to start.<br><br>${escape(event.message || 'Unknown JavaScript error')}<br>${escape(location)}<br><br>Check that backend.js is deployed next to index.html.</div>`;
    });
    window.setTimeout(() => {
      if (window.__meetingNotebookStarted) return;
      const list = document.getElementById('meetingList');
      if (!list || list.getAttribute('aria-busy') !== 'true') return;
      list.setAttribute('aria-busy', 'false');
      list.innerHTML = '<div class="empty-list">The notebook app script did not start. Check that backend.js is next to index.html.</div>';
    }, 8000);
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="backend.js"></script>
  <script>
    window.__meetingNotebookStarted = true;
    const DEFAULT_BASE = 'https:' + String.fromCharCode(47, 47) + 'api.groq.com/openai/v1';
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const langSel = (code) => { try { return (localStorage.getItem('mnLang') || 'auto') === code ? ' selected' : ''; } catch (e) { return code === 'auto' ? ' selected' : ''; } };
    const blankMeeting = (notebook = 'Inbox') => ({

      }
      state.contacts.push({ id: newId(), name: name || email.split('@')[0], email, groups });
      return true;
    }

    // ---------- Participant picker inside a meeting ----------
    const chipHtml = (name) => `<span class="chip" data-chip="${esc(name)}">${esc(name)}<button type="button" data-remove-chip aria-label="Remove ${esc(name)}">×</button></span>`;
    const chosenPeople = () => [...document.querySelectorAll('#peopleChips [data-chip]')].map((c) => c.dataset.chip);
    function addPerson(name) {
      name = String(name || '').trim();
      const box = $('#peopleChips');
      if (!name || !box) return;
      if (chosenPeople().some((x) => x.toLowerCase() === name.toLowerCase())) return;
      box.insertAdjacentHTML('beforeend', chipHtml(name));
      setDirty();
    }
    function renderPeopleMenu() {
      const input = $('#peopleInput'), menu = $('#peopleMenu');
      if (!input || !menu) return;
      const raw = input.value.trim(), q = raw.toLowerCase(), chosen = chosenPeople().map((x) => x.toLowerCase());
      const matches = state.contacts.filter((c) => !chosen.includes(personLabel(c).toLowerCase()) && (!q || [c.name, c.email, (c.groups || []).join(' ')].join(' ').toLowerCase().includes(q))).slice(0, 8);
      const exact = q && state.contacts.some((c) => personLabel(c).toLowerCase() === q);
      let html = matches.map((c) => `<button type="button" class="people-opt" data-pick="${esc(personLabel(c))}"><b>${esc(personLabel(c))}</b><span>${esc([c.email, (c.groups || []).join(', ')].filter(Boolean).join(' · '))}</span></button>`).join('');
      if (raw && !exact) html += `<button type="button" class="people-opt" data-pick="${esc(raw)}"><b>Add "${esc(raw)}"</b><span>as a one-off guest</span></button>`;
      if (!html) html = '<div class="people-opt"><span>No contacts left to pick. Add people under People in the sidebar.</span></div>';
      menu.innerHTML = html;
      menu.hidden = false;
    }
    function peoplePickerHtml(note) {
      const groups = allGroups();
      return `<div class="people-picker" id="peoplePicker">
        <div class="chips" id="peopleChips">${(note.participants || []).map(chipHtml).join('')}</div>
        <div class="people-input-row"><input id="peopleInput" placeholder="Type a name or email to add..." autocomplete="off" aria-label="Add a participant">
          <select id="peopleGroupSel" aria-label="Add a whole group"><option value="">+ Add a group</option>${groups.map((g) => `<option value="${esc(g)}">${esc(g)} (${state.contacts.filter((c) => (c.groups || []).includes(g)).length})</option>`).join('')}</select>
          <button type="button" class="btn" data-copy-emails>Copy emails</button></div>
        <div class="people-menu" id="peopleMenu" hidden></div></div>`;
    }
    async function copyEmails() {
      const byName = new Map(state.contacts.map((c) => [personLabel(c).toLowerCase(), c]));
      const names = chosenPeople();
      const emails = names.map((n) => byName.get(n.toLowerCase())?.email).filter(Boolean);
      if (!emails.length) { toast('None of the selected people have an email in your master list.'); return; }
      try { await navigator.clipboard.writeText(emails.join(', ')); toast('Copied ' + emails.length + ' email' + (emails.length === 1 ? '' : 's') + (emails.length < names.length ? ' (' + (names.length - emails.length) + ' without an email skipped).' : '.')); }
      catch (error) { toast('Could not copy: ' + error.message); }
    }

    // ---------- AI chat bar ----------
    function meetingBlock(n, full) {
      const L = [`## ${n.title || 'Untitled meeting'} (${n.date || 'no date'}; notebook: ${n.notebook || 'Inbox'}${(n.participants || []).length ? '; people: ' + n.participants.join(', ') : ''})`];
      if (n.summary) L.push('Summary: ' + n.summary);
      if ((n.keyPoints || []).length) L.push('Key points: ' + n.keyPoints.join(' | '));
      if ((n.decisions || []).length) L.push('Decisions: ' + n.decisions.join(' | '));
      if ((n.actionItems || []).length) L.push('Action items: ' + n.actionItems.map((a) => `${a.done ? '[done]' : '[open]'} ${a.task}${a.owner ? ' (owner: ' + a.owner + ')' : ''}${a.due ? ' (due: ' + a.due + ')' : ''}`).join(' | '));
      if ((n.followUps || []).length) L.push('Follow-ups: ' + n.followUps.join(' | '));
      if (full) { if (n.rawNotes) L.push('Raw notes: ' + n.rawNotes); if (n.transcript) L.push('Transcript: ' + n.transcript); }
      return L.join('\n');
    }
    function chatScope() { return state.chat.scope === 'meeting' && state.current ? 'meeting' : 'all'; }
    function chatKey() { return chatScope() === 'meeting' ? 'm:' + (state.current.id || 'draft') : 'all'; }
    function chatContext() {
      let out = 'Today is ' + todayIso() + '.\n\n';
      if (chatScope() === 'meeting') return (out + meetingBlock(readEditor() || state.current, true)).slice(0, 80000);
      state.notes.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).forEach((n) => {
        const block = meetingBlock(n, false) + '\n\n';
        if (out.length + block.length < 80000) out += block;
      });
      return out;
    }
    const chatFormat = (t) => esc(t).replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    function chatEnsureDom() {
      if ($('#chatFab')) return;
      document.body.insertAdjacentHTML('beforeend', `<button class="chat-fab" id="chatFab" aria-label="Ask AI about your meetings" aria-expanded="false" title="Ask AI">✳</button>
        <div class="chat-bar" id="chatBar" role="region" aria-label="Ask AI" hidden>
          <div class="chat-head"><b>Ask AI</b><select id="chatScope" aria-label="What to ask about"><option value="meeting">This meeting</option><option value="all">All my meetings</option></select><button class="btn" data-chat-clear>Clear</button></div>
          <div class="chat-msgs" id="chatMsgs"></div>
          <form class="chat-form" id="chatForm" autocomplete="off"><input id="chatQ" maxlength="800" placeholder="Ask about your meetings..." aria-label="Question"><button class="primary" aria-label="Send">Ask</button></form></div>`);
      $('#chatForm').addEventListener('submit', (event) => { event.preventDefault(); const q = $('#chatQ').value.trim(); if (q) { $('#chatQ').value = ''; chatAsk(q); } });
    }
    function chatRender() {
      chatEnsureDom();
      const scope = chatScope(), sel = $('#chatScope');
      sel.value = scope;
      sel.querySelector('option[value="meeting"]').disabled = !state.current;
      const hist = state.chat.history[chatKey()] || [];
      const hasKey = !!state.ai?.keys?.[state.ai.provider];
      const suggestions = scope === 'meeting'
        ? ['Summarise this meeting in 3 bullets', 'What are the open action items?', 'What was decided and why?']
        : ['What are all my open action items?', 'What did we decide recently?', 'Which meetings involved the most follow-ups?'];
      $('#chatMsgs').innerHTML = (!hasKey ? '<div class="chat-a err">Add an AI provider key in AI &amp; settings to use chat.</div>' : '')
        + (!hist.length ? `<p class="quiet">Ask anything about ${scope === 'meeting' ? 'the meeting you have open' : 'your saved meetings'}.</p><div class="chip-row">${suggestions.map((s) => `<button class="chip-btn" data-chat-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : '')
        + hist.map((h) => `<div class="chat-q"><span>${esc(h.q)}</span></div>${h.a || h.err ? `<div class="chat-a${h.err ? ' err' : ''}"><p>${chatFormat(h.a)}</p></div>` : '<div class="chat-a quiet">Thinking...</div>'}`).join('');
      const box = $('#chatMsgs');
      box.scrollTop = box.scrollHeight;
    }
    function chatSetOpen(on) {
      chatEnsureDom();
      state.chat.open = on;
      $('#chatBar').hidden = !on;
      $('#chatFab').setAttribute('aria-expanded', String(on));
      $('#chatFab').textContent = on ? '×' : '✳';
      if (on) { chatRender(); setTimeout(() => $('#chatQ')?.focus(), 60); }
    }
    async function chatAsk(question) {
      if (state.chat.busy) return;
      if (!state.ai?.keys?.[state.ai.provider]) { chatRender(); return; }
      const key = chatKey(), hist = (state.chat.history[key] = state.chat.history[key] || []);
      const entry = { q: question, a: '' };
      hist.push(entry);
      state.chat.busy = true;
      chatRender();
      try {
        const result = await gs('askMeetings', { question, history: hist.slice(0, -1).slice(-6), context: chatContext() });
        entry.a = result.answer;
      } catch (error) { entry.a = error.message; entry.err = true; }
      state.chat.busy = false;
      chatRender();
    }

    // ---------- Event wiring for the new features ----------
    document.addEventListener('click', async (event) => {
      const t = event.target;
      if (t.matches?.('input[type="date"]')) { try { t.showPicker(); } catch (e) {} }
      if (!t.closest('#peoplePicker')) { const m = $('#peopleMenu'); if (m) m.hidden = true; }
      const button = t.closest('button');
      if (!button) return;
      if (button.matches('[data-filter]')) {
        if (state.filter !== button.dataset.filter) return;
        if (state.filter === 'actions') renderActionsView();
        else { app.classList.remove('mobile-editor'); if (state.filter === 'trash') await showTrash(); }
      } else if (button.id === 'peopleButton') { if (!dirtyGuard()) return; renderPeopleView(); }
      else if (button.matches('[data-open-meeting]')) { if (!dirtyGuard()) return; const note = noteById(button.dataset.openMeeting); if (note) openMeeting(note, true); }
      else if (button.matches('[data-action-group]')) { state.actionGroup = button.dataset.actionGroup; renderActionsView(); }
      else if (button.matches('[data-action-showdone]')) { state.actionShowDone = !state.actionShowDone; renderActionsView(); }
      else if (button.matches('[data-restore]')) {
        const id = button.dataset.restore;
        try { await gs('restoreMeeting', id); const n = state.trash.find((x) => x.id === id); state.trash = state.trash.filter((x) => x.id !== id); if (n) { delete n.deletedAt; state.notes = [n, ...state.notes]; } toast('Meeting restored.'); }
        catch (error) { toast('Could not restore: ' + error.message); }
        renderList();
      } else if (button.matches('[data-purge]')) {
        if (!confirm('Delete this meeting forever? This cannot be undone.')) return;
        const id = button.dataset.purge;
        try { await gs('purgeMeeting', id); state.trash = state.trash.filter((x) => x.id !== id); toast('Deleted forever.'); }
        catch (error) { toast('Could not delete: ' + error.message); }
        renderList();
      } else if (button.matches('[data-empty-trash]')) {
        if (!state.trash.length || !confirm('Delete everything in the recycle bin forever?')) return;
        for (const n of [...state.trash]) { try { await gs('purgeMeeting', n.id); state.trash = state.trash.filter((x) => x.id !== n.id); } catch (error) { toast('Stopped: ' + error.message); break; } }
        renderList();
      } else if (button.matches('[data-people-group]')) { state.peopleGroup = button.dataset.peopleGroup; renderPeopleView(); }
      else if (button.matches('[data-add-contact]')) {
        if (addContact($('#newName').value, $('#newEmail').value, parseGroups($('#newGroups').value))) { queueContactsSave(); renderPeopleView(); }
      } else if (button.matches('[data-bulk-add]')) {
        const groups = parseGroups($('#bulkGroups').value);
        let count = 0;
        String($('#bulkText').value || '').split(/[\n;]+/).map((x) => x.trim()).filter(Boolean).forEach((line) => {
          const m = line.match(/^(.*?)\s*<([^>]+)>$/);
          if (m) { if (addContact(m[1].replace(/^["']|["']$/g, ''), m[2], groups)) count++; }
          else if (line.includes('@')) { if (addContact('', line, groups)) count++; }
          else if (addContact(line, '', groups)) count++;
        });
        if (count) { queueContactsSave(); renderPeopleView(); toast('Added ' + count + ' ' + (count === 1 ? 'person' : 'people') + '.'); }
      } else if (button.matches('[data-remove-contact]')) {
        const id = button.closest('[data-contact]').dataset.contact;
        state.contacts = state.contacts.filter((c) => c.id !== id);
        queueContactsSave(); renderPeopleView();
      } else if (button.matches('[data-rename-group]')) {
        const old = state.peopleGroup, name = prompt('New group name', old);
        if (!name?.trim() || name.trim() === old) return;
        state.contacts.forEach((c) => { c.groups = [...new Set((c.groups || []).map((g) => (g === old ? name.trim() : g)))]; });
        state.peopleGroup = name.trim(); queueContactsSave(); renderPeopleView();
      } else if (button.matches('[data-delete-group]')) {
        const old = state.peopleGroup;
        if (!confirm('Delete the group "' + old + '"? The people stay in your master list.')) return;
        state.contacts.forEach((c) => { c.groups = (c.groups || []).filter((g) => g !== old); });
        state.peopleGroup = ''; queueContactsSave(); renderPeopleView();
      } else if (button.matches('[data-remove-chip]')) { button.closest('.chip').remove(); setDirty(); }
      else if (button.matches('[data-pick]')) { addPerson(button.dataset.pick); const input = $('#peopleInput'); input.value = ''; input.focus(); renderPeopleMenu(); }
      else if (button.matches('[data-copy-emails]')) await copyEmails();
      else if (button.id === 'chatFab') chatSetOpen(!state.chat.open);
      else if (button.matches('[data-chat-clear]')) { state.chat.history[chatKey()] = []; chatRender(); }
      else if (button.matches('[data-chat-suggest]')) chatAsk(button.dataset.chatSuggest);
    });
    document.addEventListener('input', (event) => {
      const t = event.target;
      if (t.id === 'peopleInput') { renderPeopleMenu(); return; }
      const row = t.closest?.('#peopleView [data-contact]');
      if (row && t.dataset.contactField) {
        const c = state.contacts.find((x) => x.id === row.dataset.contact);
        if (!c) return;
        c[t.dataset.contactField] = t.dataset.contactField === 'groups' ? parseGroups(t.value) : t.value;
        queueContactsSave();
      }
    });
    document.addEventListener('change', (event) => {
      const t = event.target;
      if (t.id === 'peopleGroupSel') {
        const group = t.value;
        t.value = '';
        if (group) state.contacts.filter((c) => (c.groups || []).includes(group)).forEach((c) => addPerson(personLabel(c)));
      } else if (t.id === 'chatScope') { state.chat.scope = t.value; chatRender(); }
      else if (t.matches?.('[data-act-toggle]')) toggleAction(t.dataset.note, Number(t.dataset.index), t.checked);
      else if (t.dataset?.contactField === 'groups') updateGroupChips();
    });
    document.addEventListener('focusin', (event) => { if (event.target.id === 'peopleInput') renderPeopleMenu(); });
    document.addEventListener('keydown', (event) => {
      if (event.target.id !== 'peopleInput') return;
      const input = event.target;
      if (event.key === 'Enter' || event.key === ',') {
        event.preventDefault();
        const first = $('#peopleMenu [data-pick]');
        const value = event.key === ',' ? input.value.replace(/,/g, '') : (first ? first.dataset.pick : input.value);
        addPerson(value); input.value = ''; renderPeopleMenu();
      } else if (event.key === 'Escape') { const m = $('#peopleMenu'); if (m) m.hidden = true; }
      else if (event.key === 'Backspace' && !input.value) { const last = [...document.querySelectorAll('#peopleChips .chip')].pop(); if (last) { last.remove(); setDirty(); } }
    });

    async function boot() {
      try {
        await window.mnSignIn();
        list.innerHTML = '<div class="loading">Loading your notebooks...</div>';
        const meetings = await gs('getMeetings');
        state.notes = meetings || [];
        list.setAttribute('aria-busy', 'false');
        $('#accountLabel').textContent = 'Private Drive storage';
        chatEnsureDom();
        renderList();
        if (state.notes.length) openMeeting(state.notes[0]);
        gs('getContacts').then((c) => { state.contacts = c || []; if (state.current && !state.dirty && !state.view) editorShell.innerHTML = editorHtml(state.current); }).catch((error) => toast('People list could not load: ' + error.message));
        gs('meetingAiStatus').then((ai) => { state.ai = ai; }).catch((error) => {
          toast('AI settings could not load: ' + error.message);
        });
      } catch (error) {
        list.setAttribute('aria-busy', 'false');
        list.innerHTML = `<div class="empty-list">Could not load your notebook.<br><br>${esc(error.message)}<br><br><button class="btn" id="retry">Try again</button></div>`;
        list.addEventListener('click', () => location.reload(), { once: true });
      }
    }
    boot();
  </script>
</body>
</html>
