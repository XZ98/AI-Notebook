<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <title>Meeting Notebook</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f2; --surface: #fff; --ink: #20231f; --muted: #767a73; --line: #e8e7e2;
      --accent: #d9775f; --accent-soft: #fbede8; --green: #4a7561; --shadow: 0 12px 35px #39392b0d;
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 252px 320px minmax(0, 1fr); min-height: 100vh; }
    .rail { display: flex; flex-direction: column; min-height: 100vh; padding: 22px 14px; background: #f0efeb; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 24px; font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #fff; background: var(--accent); font-size: 16px; }
    .new-btn, .primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 13px; border: 0; border-radius: 10px; color: #fff; background: var(--accent); font-weight: 650; }
    .new-btn { margin: 0 4px 20px; box-shadow: 0 4px 12px #d9775f22; }
    .new-btn:hover, .primary:hover { background: #c9654d; }
    .nav-group { display: grid; gap: 4px; }
    .nav-label { padding: 15px 10px 6px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; color: #50544e; background: transparent; text-align: left; }
    .nav-item:hover, .nav-item.active { color: var(--ink); background: #e7e5df; }
    .nav-item.active { font-weight: 700; }
    .nav-item .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .nav-icon { display: inline-grid; place-items: center; width: 18px; color: #878b83; font-size: 16px; }
    .notebooks { display: grid; gap: 3px; }
    .notebook-row { display: flex; align-items: center; gap: 5px; }
    .notebook-row .nav-item { min-width: 0; }
    .notebook-row .nav-item span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 9px; color: var(--muted); background: transparent; }
    .icon-btn:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
    .rail-bottom { margin-top: auto; padding: 16px 5px 0; border-top: 1px solid #e3e1dc; }
    .account { padding: 5px 9px 0; color: var(--muted); font-size: 12px; }
    .library { min-width: 0; height: 100vh; overflow: auto; background: #faf9f7; border-right: 1px solid var(--line); }
    .library-head { position: sticky; top: 0; z-index: 3; padding: 19px 16px 12px; background: #faf9f7ee; backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .library-title-row { display: flex; align-items: center; gap: 10px; }
    .library-title-row h1 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
    .library-title-row .icon-btn { margin-left: auto; }
    .search { position: relative; margin-top: 15px; }
    .search input { width: 100%; height: 39px; padding: 0 36px 0 35px; border: 1px solid #e7e5e0; border-radius: 10px; outline: 0; background: var(--surface); }
    .search input:focus { border-color: #d3a398; box-shadow: 0 0 0 3px #d9775f15; }
    .search-mark { position: absolute; top: 8px; left: 11px; color: #999c95; font-size: 17px; }
    .shortcut { position: absolute; top: 9px; right: 10px; color: #a4a69f; font-size: 10px; }
    .meeting-list { display: grid; gap: 3px; padding: 9px; }
    .meeting-card { display: block; width: 100%; padding: 12px; border: 1px solid transparent; border-radius: 11px; background: transparent; text-align: left; }
    .meeting-card:hover { background: #f1f0ec; }
    .meeting-card.selected { border-color: #eee2de; background: #fff; box-shadow: 0 2px 8px #39392b08; }
    .meeting-card-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 680; }
    .meeting-card-title span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meeting-card-date { flex: none; color: #999b95; font-size: 11px; font-weight: 450; }
    .meeting-card-summary { display: -webkit-box; margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 12px; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .meeting-card-meta { display: flex; gap: 6px; margin-top: 9px; color: #92958d; font-size: 10px; }
    .tag { padding: 2px 7px; border-radius: 999px; background: #f0efeb; }
    .empty-list { padding: 34px 18px; color: var(--muted); text-align: center; }
    .editor-shell { min-width: 0; height: 100vh; overflow: auto; }
    .editor-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 62px; padding: 11px clamp(18px, 4vw, 52px); background: #f6f5f2ee; backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .save-state { margin-right: auto; color: var(--muted); font-size: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: #50544e; font-weight: 580; }
    .btn:hover { border-color: #d8d6d0; color: var(--ink); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn.danger { color: #b94f45; }
    .btn.recording { color: #b94f45; border-color: #e6aaa0; background: #fff5f2; }
    .editor { width: min(850px, 100%); margin: 0 auto; padding: 36px clamp(20px, 5vw, 68px) 90px; }
    .crumb { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .crumb input { width: 180px; padding: 3px 7px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; }
    .crumb input:focus { border-color: var(--line); outline: 0; background: #fff; }
    .title-input { display: block; width: 100%; margin: 16px 0 18px; padding: 0; border: 0; outline: 0; background: transparent; font-size: clamp(29px, 4vw, 40px); font-weight: 720; letter-spacing: -.055em; line-height: 1.16; }
    .title-input::placeholder { color: #b5b6b0; }
    .meta-row { display: grid; grid-template-columns: 110px minmax(0,1fr); align-items: center; gap: 12px; margin: 8px 0; color: var(--muted); font-size: 12px; }
    .meta-row label { display: flex; align-items: center; gap: 7px; }
    .meta-row input { width: 100%; min-width: 0; padding: 6px 9px; border: 1px solid transparent; border-radius: 7px; outline: 0; background: transparent; }
    .meta-row input:hover, .meta-row input:focus { border-color: var(--line); background: #fff; }
    .divider { height: 1px; margin: 25px 0; background: var(--line); }
    .section { margin: 24px 0; }
    .section-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 13px; font-weight: 750; letter-spacing: .005em; }
    .section-icon { color: var(--accent); }
    .section textarea { display: block; width: 100%; min-height: 96px; padding: 12px 13px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; outline: 0; background: #fff; line-height: 1.65; }
    .section textarea:focus, .action-row input:focus { border-color: #d3a398; box-shadow: 0 0 0 3px #d9775f12; }
    .section textarea::placeholder { color: #b2b4ad; }
    .summary-area { min-height: 100px !important; font-size: 15px; }
    .quiet { color: var(--muted); font-size: 12px; }
    .transcript-area { min-height: 180px !important; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .action-list { display: grid; gap: 8px; }
    .action-row { display: grid; grid-template-columns: 24px minmax(140px,1fr) minmax(90px,130px) minmax(90px,120px) 32px; align-items: center; gap: 7px; }
    .action-row input:not([type=checkbox]) { min-width: 0; width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: #fff; font-size: 12px; }
    .action-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--green); }
    .action-row.done input:not([type=checkbox]) { color: #999; text-decoration: line-through; }
    .action-add { margin-top: 9px; padding: 5px 0; border: 0; color: var(--green); background: transparent; font-size: 12px; font-weight: 650; }
    .transcript-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; }
    .privacy-callout { padding: 10px 12px; border: 1px solid #f1e1dc; border-radius: 9px; background: #fff8f5; color: #81584e; font-size: 11px; line-height: 1.5; }
    .toast { position: fixed; right: 22px; bottom: 20px; z-index: 10; max-width: min(420px, calc(100vw - 32px)); padding: 11px 15px; transform: translateY(12px); opacity: 0; pointer-events: none; border-radius: 10px; color: #fff; background: #242722; box-shadow: var(--shadow); transition: .18s ease; }
    .toast.show { transform: none; opacity: 1; }
    .modal-back { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 18px; background: #1b1c1880; }
    .modal { width: min(480px, 100%); max-height: 90vh; overflow: auto; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 24px 80px #0003; }
    .modal h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.03em; }
    .modal p { color: var(--muted); font-size: 13px; }
    .modal label { display: grid; gap: 5px; margin: 12px 0; color: #5b5e58; font-size: 12px; font-weight: 650; }
    .modal input, .modal select { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--surface); }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
    .modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
    .loading { padding: 40px; color: var(--muted); text-align: center; }
    .empty-editor { display: grid; min-height: calc(100vh - 62px); place-content: center; padding: 30px; color: var(--muted); text-align: center; }
    .empty-editor b { color: var(--ink); font-size: 22px; letter-spacing: -.04em; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @media (max-width: 960px) { .app { grid-template-columns: 205px minmax(250px, 300px) minmax(0,1fr); } .rail { padding-inline: 9px; } .editor { padding-inline: 28px; } }
    @media (max-width: 740px) {
      .app { display: block; }
      .rail { position: fixed; z-index: 6; right: 0; bottom: 0; left: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-around; min-height: auto; height: calc(58px + env(safe-area-inset-bottom)); padding: 4px 6px env(safe-area-inset-bottom); border-top: 1px solid var(--line); border-right: 0; background: #f8f7f4ed; backdrop-filter: blur(12px); }
      .brand, .new-btn, .nav-label, .notebooks, .rail-bottom { display: none; }
      .nav-group { display: contents; }
      .nav-item { display: grid; justify-items: center; gap: 0; width: auto; min-width: 62px; padding: 5px 8px; font-size: 10px; }
      .nav-item .count { display: none; }
      .nav-icon { font-size: 17px; }
      .library { position: fixed; inset: 0 0 calc(58px + env(safe-area-inset-bottom)); z-index: 1; height: auto; border-right: 0; }
      .editor-shell { display: none; height: calc(100dvh - 58px - env(safe-area-inset-bottom)); }
      .app.mobile-editor .library { display: none; }
      .app.mobile-editor .editor-shell { display: block; }
      .editor-top { min-height: 54px; padding-inline: 13px; }
      .editor { padding: 25px 18px 70px; }
      .title-input { font-size: 31px; }
      .action-row { grid-template-columns: 20px minmax(110px,1fr) minmax(80px,100px) 32px; }
      .action-row .due-input { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="Notebook navigation">
      <div class="brand"><span class="brand-mark">&#x2733;</span> Meeting Notebook</div>
      <button class="new-btn" id="newMeeting"><span>&#xff0b;</span> New meeting</button>
      <div class="nav-group">
        <button class="nav-item active" data-filter="all"><span class="nav-icon">&#x25a4;</span><span>All meetings</span><span class="count" id="allCount"></span></button>
        <button class="nav-item" data-filter="inbox"><span class="nav-icon">&#x2311;</span><span>Inbox</span><span class="count" id="inboxCount"></span></button>
        <button class="nav-item" data-filter="actions"><span class="nav-icon">&#x2611;</span><span>Action items</span></button>
      </div>
      <div class="nav-label">Notebooks <button class="icon-btn" id="addNotebook" title="Create a notebook" aria-label="Create a notebook">&#xff0b;</button></div>
      <div class="notebooks" id="notebooks"></div>
      <div class="rail-bottom">
        <button class="nav-item" id="settingsButton"><span class="nav-icon">&#x2699;</span><span>AI &amp; settings</span></button>
        <div class="account" id="accountLabel">Starting...</div>
      </div>
    </aside>
    <section class="library" aria-label="Meeting directory">
      <header class="library-head">
        <div class="library-title-row"><h1 id="listTitle">All meetings</h1><button class="icon-btn" id="listNew" title="New meeting" aria-label="New meeting">&#xff0b;</button></div>
        <label class="search"><span class="search-mark" aria-hidden="true">&#x2315;</span><input id="search" type="search" placeholder="Search notes, decisions, people&#x2026;" autocomplete="off" aria-label="Fuzzy search all meeting notes"><span class="shortcut">&#x2318; K</span></label>
      </header>
      <div class="meeting-list" id="meetingList" aria-live="polite" aria-busy="true"><div class="loading">Loading your notebooks&#x2026;</div></div>
    </section>
    <main class="editor-shell" id="editorShell"><div class="empty-editor"><div><b>Your meetings, thoughtfully organized.</b><p>Choose a meeting or start a new one.</p><button class="primary" id="emptyNew">&#xff0b; New meeting</button></div></div></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="audioFile" class="visually-hidden" type="file" accept="audio/*,.wav,.mp3,.m4a,.webm,.ogg,.flac">
  <script>
    window.addEventListener('error', (event) => {
      const list = document.getElementById('meetingList');
      if (!list) return;
      list.setAttribute('aria-busy', 'false');
      const escape = (value) => String(value || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const location = event.lineno ? `Line ${event.lineno}, column ${event.colno || 0}` : 'Source location unavailable';
      list.innerHTML = `<div class="empty-list">The notebook script failed to start.<br><br>${escape(event.message || 'Unknown JavaScript error')}<br>${escape(location)}<br><br>Check that backend.js is deployed next to index.html.</div>`;
    });
    window.setTimeout(() => {
      if (window.__meetingNotebookStarted) return;
      const list = document.getElementById('meetingList');
      if (!list || list.getAttribute('aria-busy') !== 'true') return;
      list.setAttribute('aria-busy', 'false');
      list.innerHTML = '<div class="empty-list">The notebook app script did not start. Check that backend.js is next to index.html.</div>';
    }, 8000);
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="backend.js"></script>
  <script>
    window.__meetingNotebookStarted = true;
    const DEFAULT_BASE = 'https:' + String.fromCharCode(47, 47) + 'api.groq.com/openai/v1';
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const blankMeeting = (notebook = 'Inbox') => ({
      id: '', title: '', date: new Date().toISOString().slice(0, 10), notebook,
      participants: [], tags: [], summary: '', keyPoints: [], decisions: [], actionItems: [],
      followUps: [], transcript: '', rawNotes: '', createdAt: Date.now(), updatedAt: Date.now(),
    });
    const state = { notes: [], current: null, filter: 'all', query: '', dirty: false, saving: false, ai: null, recorder: null, chunks: [], stream: null, recTimer: 0, recStarted: 0 };
    const app = $('#app'), list = $('#meetingList'), editorShell = $('#editorShell'), toastBox = $('#toast');
    let toastTimer = 0;
    $('#accountLabel').textContent = 'Connecting to Google Drive\u2026';
    function toast(message) { toastBox.textContent = message; toastBox.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastBox.classList.remove('show'), 3200); }
    function normalized(s) {
      const source = String(s || '').normalize('NFKD').toLowerCase();
      const words = [];
      let word = '';
      for (let i = 0; i < source.length; i++) {
        const code = source.charCodeAt(i);
        const combiningMark = code >= 0x300 && code <= 0x36f;
        const asciiWord = (code >= 48 && code <= 57) || (code >= 97 && code <= 122);
        const punctuation = code === 0x2014 || code === 0x2013 || code === 0x2026 ||
          code === 0xff0c || code === 0x3002 || (code >= 0xff01 && code <= 0xff0f) ||
          (code >= 0xff1a && code <= 0xff20) || (code >= 0xff3b && code <= 0xff40) ||
          (code >= 0xff5b && code <= 0xff65) || (code >= 0x3008 && code <= 0x3011) ||
          code === 0x00b7;
        if (combiningMark) continue;
        if (code <= 0x20 || (code < 128 && !asciiWord) || punctuation) {
          if (word) { words.push(word); word = ''; }
        } else {
          word += source[i];
        }
      }
      if (word) words.push(word);
      return words.join(' ');
    }
    function editDistance(a, b) {
      if (Math.abs(a.length - b.length) > 2) return 3;
      var prev = [], next, i, j, cost, rowMin, tmp;
      for (j = 0; j <= b.length; j++) prev.push(j);
      for (i = 1; i <= a.length; i++) {
        next = [i];
        rowMin = i;
        for (j = 1; j <= b.length; j++) {
          cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
          next[j] = Math.min(next[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
          if (next[j] < rowMin) rowMin = next[j];
        }
        if (rowMin > 2) return 3;
        tmp = prev; prev = next; next = tmp;
      }
      return prev[b.length];
    }
    function fuzzyFieldScore(query, field) {
      const q = normalized(query), text = normalized(field);
      if (!q || !text) return 0;
      if (text.includes(q)) return 1.25 + Math.min(.25, q.length / Math.max(1, text.length));
      const terms = q.split(' '), words = text.split(' ').filter(Boolean);
      let total = 0;
      for (const term of terms) {
        let best = 0;
        for (const word of words) {
          if (word.startsWith(term)) best = Math.max(best, .92);
          else if (term.startsWith(word) && word.length >= 3) best = Math.max(best, .78);
          else if (term.length >= 4 && word.length >= 4) {
            const d = editDistance(term.slice(0, 32), word.slice(0, 32));
            if (d <= 2) best = Math.max(best, .78 - d * .12);
            let i = 0;
            for (const c of word) if (c === term[i]) i++;
            if (i === term.length) best = Math.max(best, .7 * term.length / word.length);
          }
        }
        if (!best) return 0;
        total += best;
      }
      return total / terms.length;
    }
    function matchScore(note, query) {
      const fields = [
        [note.title, 7], [note.notebook, 5], [(note.participants || []).join(' '), 4],
        [(note.tags || []).join(' '), 3], [note.summary, 4], [(note.decisions || []).join(' '), 4],
        [(note.keyPoints || []).join(' '), 3], [(note.actionItems || []).map((a) => [a.task, a.owner].join(' ')).join(' '), 3],
        [(note.followUps || []).join(' '), 2], [note.transcript, 1], [note.rawNotes, 1],
      ];
      return fields.reduce((score, [value, weight]) => Math.max(score, fuzzyFieldScore(query, value) * weight), 0);
    }
    const noteById = (id) => state.notes.find((note) => note.id === id);
    function visibleNotes() {
      let notes = state.notes;
      if (state.filter === 'inbox') notes = notes.filter((note) => !note.notebook || note.notebook === 'Inbox');
      else if (state.filter === 'actions') notes = notes.filter((note) => (note.actionItems || []).some((item) => !item.done));
      else if (state.filter.startsWith('notebook:')) notes = notes.filter((note) => note.notebook === state.filter.slice(9));
      const q = state.query.trim();
      if (q) notes = notes.map((note) => ({ note, score: matchScore(note, q) })).filter((x) => x.score >= 1.35).sort((a, b) => b.score - a.score || String(b.note.date).localeCompare(String(a.note.date))).map((x) => x.note);
      return notes.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (b.updatedAt || 0) - (a.updatedAt || 0));
    }
    function dateLabel(date) {
      const d = new Date(String(date || '') + 'T12:00:00');
      return Number.isNaN(+d) ? '' : new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(d);
    }
    function renderList() {
      const notes = visibleNotes();
      app.querySelectorAll('[data-filter]').forEach((button) => button.classList.toggle('active', button.dataset.filter === state.filter));
      $('#allCount').textContent = state.notes.length || '';
      $('#inboxCount').textContent = state.notes.filter((n) => !n.notebook || n.notebook === 'Inbox').length || '';
      const notebooks = [...new Set(state.notes.map((n) => n.notebook).filter((n) => n && n !== 'Inbox'))].sort((a, b) => a.localeCompare(b));
      $('#notebooks').innerHTML = notebooks.map((notebook) => `<div class="notebook-row"><button class="nav-item${state.filter === 'notebook:' + notebook ? ' active' : ''}" data-notebook="${esc(notebook)}"><span class="nav-icon">\u25a7</span><span>${esc(notebook)}</span></button></div>`).join('');
      $('#listTitle').textContent = state.filter === 'inbox' ? 'Inbox' : state.filter === 'actions' ? 'Action items' : state.filter.startsWith('notebook:') ? state.filter.slice(9) : state.query ? 'Search results' : 'All meetings';

    async function transcribeBlob(blob, consentGiven = false) {
      if (blob.size > 7 * 1024 * 1024) { toast('Audio is larger than 7 MB. Record a shorter segment or compress it.'); return; }
      if (!state.ai?.keys?.[state.ai.provider]) { toast('Save an AI provider key before transcribing audio.'); return; }
      if (!consentGiven) {
        const consent = confirm('Your audio will be sent to ' + ({ gemini: 'Google Gemini', openai: 'your selected OpenAI-compatible provider', anthropic: 'Anthropic Claude' }[state.ai.provider]) + ' for transcription. The audio is not saved in your notebook. Continue?');
        if (!consent) return;
      }
      toast('Transcribing audio\u2026');
      try {
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Could not read the audio file.'));
          reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
          reader.readAsDataURL(blob);
        });

    async function toggleRecording(button) {
      if (state.recorder) { state.recorder.stop(); button.disabled = true; button.textContent = 'Finishing\u2026'; return; }

      if (!state.ai?.keys?.[state.ai.provider]) { toast('Save an AI provider key before recording.'); renderSettings(); return; }
      if (state.ai.provider === 'anthropic') { toast('Audio transcription needs Gemini or an OpenAI-compatible provider.'); return; }
      if (!confirm('Recording audio requires microphone permission. When you stop, the recording will be sent to ' + (state.ai.provider === 'gemini' ? 'Google Gemini' : 'your selected OpenAI-compatible provider') + ' for transcription and minutes. The audio is not saved in your notebook. Continue?')) return;
      try {
        state.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.chunks = [];
        state.recorder = new MediaRecorder(state.stream);
        state.recorder.ondataavailable = (event) => { if (event.data.size) state.chunks.push(event.data); };
        state.recorder.onstop = async () => {
          const blob = new Blob(state.chunks, { type: state.recorder?.mimeType || 'audio/webm' });
          state.stream?.getTracks().forEach((track) => track.stop());
          state.stream = null; state.recorder = null; state.chunks = [];
          clearInterval(state.recTimer);
          const record = $('[data-audio="record"]');
          if (record) { record.disabled = false; record.classList.remove('recording'); record.textContent = '\u25cf Record'; }
          await transcribeBlob(blob, true);
        };
        state.recorder.start(1000);
        state.recStarted = Date.now();
        button.classList.add('recording');
        const paintTimer = () => {
          const seconds = Math.floor((Date.now() - state.recStarted) / 1000);
          button.textContent = `\u25a0 ${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')} \u00b7 Stop`;
          if (state.chunks.reduce((sum, chunk) => sum + chunk.size, 0) > 6.8 * 1024 * 1024) { toast('Recording is nearing the 7 MB limit. Stop to transcribe.'); state.recorder?.stop(); }
        };
        paintTimer(); state.recTimer = setInterval(paintTimer, 1000);
      } catch (error) { state.stream?.getTracks().forEach((track) => track.stop()); state.stream = null; toast('Microphone could not start: ' + error.message); }

        list.setAttribute('aria-busy', 'false');
        list.innerHTML = `<div class="empty-list">Could not load your notebook.<br><br>${esc(error.message)}<br><br><button class="btn" id="retry">Try again</button></div>`;
        list.addEventListener('click', () => location.reload(), { once: true });
      }
    }
    boot();
  </script>
</body>
</html>
